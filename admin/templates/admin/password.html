{% extends "admin/base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<form class="card narrow" method="post">
  <h1>修改密码</h1>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>当前密码<input name="current" type="password" autocomplete="current-password" required></label>
  <label>新密码（至少 10 位）<input name="new" type="password" autocomplete="new-password" minlength="10" required></label>
  <label>再输一次新密码<input name="again" type="password" autocomplete="new-password" minlength="10" required></label>
  <button class="btn primary">保存</button>
</form>
{% endblock %}
