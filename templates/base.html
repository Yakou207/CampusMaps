<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="{% block viewport %}width=device-width, initial-scale=1, viewport-fit=cover{% endblock %}">
  <title>{% block title %}BNBU 食堂地图 · Campus Food Map{% endblock %}</title>
  <meta name="description" content="北师港浸大校园食堂与摊位地图：找吃的、看评分、写评价。A bilingual map of every canteen and food stall on the BNBU campus, rated by students.">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="preload" href="{{ url_for('static', filename='fonts/wenkai-400.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">跳到主要内容 · Skip to content</a>
  {% include "_icons.html" %}
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
